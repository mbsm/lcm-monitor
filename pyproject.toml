[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lcm-network-monitor"
version = "1.0.0"
description = "Real-time LCM network traffic monitor and visualizer"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["lcm", "network", "monitor", "traffic", "visualization", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.20.0",
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/yourusername/lcm_monitor"
Documentation = "https://github.com/yourusername/lcm_monitor#readme"
Repository = "https://github.com/yourusername/lcm_monitor"
"Bug Tracker" = "https://github.com/yourusername/lcm_monitor/issues"

[project.scripts]
lcm-monitor = "lcm_network_monitor:main"
lcm-test = "test:main"

[tool.setuptools]
py-modules = ["lcm_network_monitor", "test"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
