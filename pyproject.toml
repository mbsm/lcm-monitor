[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcm-network-monitor"
version = "1.0.0"
description = "Real-time LCM network traffic monitor and visualizer"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Matias Bustos", email = "matias.bustos.sm@outlook.com"}
]
keywords = ["lcm", "network", "monitor", "traffic", "visualization", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/mbsm/lcm-monitor"
Repository = "https://github.com/mbsm/lcm-monitor"
"Bug Tracker" = "https://github.com/mbsm/lcm-monitor/issues"

[project.scripts]
lcm-monitor = "lcm_monitor.lcm_network_monitor:main"

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310']
